[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-recorder"
version = "0.1.0"
description = "Tamper-evident, post-quantum-signed flight recorder for AI agents, with a causal-attribution investigator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dilithium-py==1.4.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
live = ["anthropic>=0.40"]

[tool.setuptools]
packages = ["fr", "agent", "investigator"]

[tool.setuptools.package-data]
agent = ["corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
