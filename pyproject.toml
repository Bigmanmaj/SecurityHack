[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrec"
version = "0.1.0"
description = "A tamper-evident flight recorder for AI agent episodes"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "dilithium-py>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
